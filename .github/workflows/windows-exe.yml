# Build a Windows onedir EXE with CUDA PyTorch cu121 (GitHub Actions windows-latest).
# The runner has no GPU; it still installs CUDA wheels so the onedir can call
# torch.cuda on the user's NVIDIA machine. CPU-only torch is not labeled GPU.
name: Windows EXE

on:
  push:
    branches: [main, cursor/tooncrafter-animator-35e1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cuda:
    name: PyInstaller onedir (windows-latest, CUDA cu121)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TORCH_VARIANT: cuda
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install CUDA PyTorch (cu121)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
          python -c "import torch, torchvision; assert torch.version.cuda, 'CPU torch installed; refusing GPU pack'; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'vision', torchvision.__version__); print('cuda_available_on_runner', torch.cuda.is_available())"

      - name: Install app dependencies and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Generate icon, fetch LGPL ffmpeg, PyInstaller, assemble release
        env:
          TORCH_VARIANT: cuda
        run: python packaging/ci_build.py

      - name: Verify CUDA release layout
        shell: pwsh
        run: |
          $root = "release/ToonCrafterAnimator"
          $exe = Join-Path $root "ToonCrafterAnimator.exe"
          if (-not (Test-Path $exe)) { throw "ToonCrafterAnimator.exe missing" }
          foreach ($name in @("ffmpeg","assets","licenses","README.txt","THIRD_PARTY_NOTICES.txt","checksums.sha256")) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "$name missing from release tree" }
          }
          $readme = Get-Content (Join-Path $root "README.txt") -Raw
          if ($readme -notmatch "CUDA") { throw "README.txt must state this build includes CUDA PyTorch" }
          $tv = Get-ChildItem -Path $root -Recurse -Filter "torchvision" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tv) { throw "torchvision package missing from onedir (nms ops)" }
          $native = Get-ChildItem -Path $tv.FullName -File | Where-Object {
            $_.Name -like "_C*" -or $_.Name -like "image_stable*" -or $_.Extension -in @(".pyd",".dll",".so")
          }
          if (-not $native) { throw "torchvision C++ extension (_C_stable/_C) missing; torchvision::nms will fail" }
          Write-Host "torchvision native:"
          $native | Format-Table Name, Length
          $tc = Get-ChildItem -Path $root -Recurse -Filter "__init__.py" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "ToonCrafter" } |
            Select-Object -First 1
          if (-not $tc) { throw "ToonCrafter package (__init__.py) missing from onedir" }
          $yaml = Get-ChildItem -Path $root -Recurse -Filter "inference_512_v1.0.yaml" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $yaml) { throw "ToonCrafter inference_512_v1.0.yaml missing from onedir" }
          $cudaHits = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match 'cublas|cudnn|cudart|nvrtc|c10_cuda|torch_cuda|cusolver|cufft'
            }
          if (-not $cudaHits -or $cudaHits.Count -lt 2) {
            throw "CUDA torch binaries missing (cublas/cudnn/c10_cuda/torch_cuda); refusing CPU-only pack as GPU"
          }
          Write-Host "CUDA natives (sample):"
          $cudaHits | Select-Object -First 25 | Format-Table Name, Length, FullName
          Get-Item $exe | Format-List FullName, Length, LastWriteTime
          Get-ChildItem $root | Format-Table Name, Length, Mode
          Write-Host "checksums.sha256 (head):"
          Get-Content (Join-Path $root "checksums.sha256") -TotalCount 15

      - name: Zip onedir (ZIP64, split if over 1.9 GiB)
        run: python packaging/zip_release.py --src release/ToonCrafterAnimator --dest ToonCrafterAnimator-windows-x64-cuda.zip --out-dir release_upload

      - name: Upload release folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToonCrafterAnimator-windows-x64-cuda
          path: release/ToonCrafterAnimator/
          if-no-files-found: error
          compression-level: 0

      - name: Attach CUDA zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ToonCrafterAnimator v1.0.${{ github.run_number }} (Windows x64, CUDA PyTorch cu121)
          body: |
            Packaged **onedir** Windows build with **CUDA PyTorch (cu121)** and matching torchvision.

            This is the GPU-capable release. On an NVIDIA PC the app lists CUDA devices and defaults to FP16. GitHub Actions itself has no GPU — the wheels are still the CUDA build, not CPU torch.

            Contents: `ToonCrafterAnimator.exe`, `ffmpeg/` (LGPL), `assets/`, `licenses/`, `README.txt` (Simplified Chinese), `THIRD_PARTY_NOTICES.txt`, `checksums.sha256`, vendored ToonCrafter, torchvision `_C_stable`.

            If you downloaded `.part01` / `.part02` files, merge them first (`copy /b …`) then unzip. See `README.txt` / `*.JOIN.txt`.

            Model weights are **not** included. Point the first-run setup at your own checkpoint + OpenCLIP file.
          files: release_upload/*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
